name: Deploy to Cloudflare Workers

on:
  workflow_run:
    workflows: ['tests']
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    # Only run if the workflow_run event was successful (when triggered by tests workflow)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: Production
    name: Deploy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Fetch encrypted credentials from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_CREDENTIALS_BUCKET }}
        run: |
          set -euo pipefail
          node tools/credential-tools.mjs pull
          jq -e '
            (.ciphertext | type == "string" and length > 0) and
            (.iv | type == "string" and length > 0)
          ' credentials.enc.json >/dev/null \
            || { echo "::error::credentials.enc.json must contain non-empty ciphertext and iv strings"; exit 1; }

      - name: Create wrangler.toml
        run: |
          cat << EOF > wrangler.toml
          name = "${{ vars.CF_WORKER_NAME }}"
          account_id = "${{ secrets.CF_ACCOUNT_ID }}"
          main = "./dist/worker.js"
          compatibility_date = "${{ vars.CF_COMPATIBILITY_DATE }}"
          send_metrics = false
          no_bundle = true
          analytics_engine_datasets = [
            { binding = "AnalyticsEngine" }
          ]

          [ai]
          binding = "AI"

          [build]
          command = "npm run build"
          EOF

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STANDARD_DOMAIN_LIST: ${{ vars.STANDARD_DOMAIN_LIST }}
          STANDARD_BSKY_DOMAIN_LIST: ${{ vars.STANDARD_BSKY_DOMAIN_LIST }}
          STANDARD_TIKTOK_DOMAIN_LIST: ${{ vars.STANDARD_TIKTOK_DOMAIN_LIST }}
          STANDARD_INSTAGRAM_DOMAIN_LIST: ${{ vars.STANDARD_INSTAGRAM_DOMAIN_LIST }}
          DIRECT_MEDIA_DOMAINS: ${{ vars.DIRECT_MEDIA_DOMAINS }}
          TEXT_ONLY_DOMAINS: ${{ vars.TEXT_ONLY_DOMAINS }}
          INSTANT_VIEW_DOMAINS: ${{ vars.INSTANT_VIEW_DOMAINS }}
          GALLERY_DOMAINS: ${{ vars.GALLERY_DOMAINS }}
          FORCE_MOSAIC_DOMAINS: ${{ vars.FORCE_MOSAIC_DOMAINS }}
          OLD_EMBED_DOMAINS: ${{ vars.OLD_EMBED_DOMAINS }}
          POLYGLOT_DOMAIN_LIST: ${{ vars.POLYGLOT_DOMAIN_LIST }}
          POLYGLOT_ACCESS_TOKEN: ${{ secrets.POLYGLOT_ACCESS_TOKEN }}
          # Deliberately NOT passed: MOSAIC_DOMAIN_LIST, MOSAIC_BSKY_DOMAIN_LIST,
          # GIF_TRANSCODE_DOMAIN_LIST, VIDEO_TRANSCODE_DOMAIN_LIST,
          # VIDEO_TRANSCODE_BSKY_DOMAIN_LIST, PBS_PROXY_DOMAIN_LIST, API_HOST_LIST,
          # BLUESKY_API_HOST_LIST, ATMOSPHERE_API_HOST_LIST.
          #
          # Each names an external microservice this deployment does not run. Pointing them at
          # hosts that do not resolve is what broke image/GIF embedding. They are omitted here so
          # a leftover GitHub repository variable cannot silently reintroduce that at deploy time.
          # (QUIET_DOMAINS and MEDIA_PROXY_DOMAIN_LIST were also removed: neither has ever been
          # read by src/constants.ts or esbuild.config.mjs.)
          TWITTER_ROOT: ${{ vars.TWITTER_ROOT }}
          INSTAGRAM_ROOT: ${{ vars.INSTAGRAM_ROOT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --no-bundle
